# Buck 业务应用 GitHub Actions 模板。
# 复制为业务仓库 .github/workflows/ci.yml。凭据只用 GitHub Actions secrets。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  verify_brick_rules:
    name: verify_brick_rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Buck business structure check
        run: node docs/buck/2.0.0-11/rules/check-business-structure.mjs .

  verify:
    name: verify
    needs: verify_brick_rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm test --if-present
      - run: ./gradlew test

  publish_tag_artifacts:
    name: publish_tag_artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Publish Maven to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish
      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" build/libs/*.jar --clobber || true

  notify_tag_release_success:
    name: notify_tag_release_success
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish_tag_artifacts
    runs-on: ubuntu-latest
    steps:
      - run: echo "Buck 2.0.0-11 published on GitHub"
