# Buck 业务前端 Nginx 模板。
upstream brick_backend {
    server backend-service-placeholder:backend-port-placeholder;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Buck 固定端点必须转发到后端，configureHttp({ baseUrl }) 不能替代这些路径。
    location /transport/ {
        proxy_pass http://brick_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /brick/ {
        proxy_pass http://brick_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api 只是前端代理前缀，后端 Controller 不应声明 /api。
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://brick_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
