# Buck 独立业务仓发布消费 smoke（GitHub Actions）。
# 复制为业务仓库 .github/workflows/brick-consume-smoke.yml。
name: brick-consume-smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  brick_consume_smoke:
    name: brick_consume_smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Resolve published Buck BOM
        env:
          BRICK_VERSION: "2.0.0-11"
          BRICK_CONSUME_NPM_PACKAGE: "@wildbuck/core-ui-frontend"
          BRICK_BACKEND_DIR: "backend"
          BRICK_GRADLE_PROJECT: ""
          BRICK_BUSINESS_CONSUMPTION_URL: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p build/brick-consume-smoke
          echo "# Buck consume smoke" > build/brick-consume-smoke/report.md
          echo "- brick_version: $BRICK_VERSION" >> build/brick-consume-smoke/report.md
          echo "- buck-bom: io.github.wu9007:buck-bom:$BRICK_VERSION" >> build/brick-consume-smoke/report.md
          echo "- npm_package: $BRICK_CONSUME_NPM_PACKAGE" >> build/brick-consume-smoke/report.md
          echo "- backend_dir: $BRICK_BACKEND_DIR" >> build/brick-consume-smoke/report.md
          echo "- gradle_project: $BRICK_GRADLE_PROJECT" >> build/brick-consume-smoke/report.md
          echo "- repository: $GITHUB_REPOSITORY" >> build/brick-consume-smoke/report.md
          echo "- consumption_url: $BRICK_BUSINESS_CONSUMPTION_URL" >> build/brick-consume-smoke/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: brick-consume-smoke
          path: build/brick-consume-smoke/
