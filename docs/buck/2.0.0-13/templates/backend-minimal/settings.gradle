// 默认只走 Maven Central / Gradle Plugin Portal。
// 设置 NEXUS_MAVEN_URL 时才加入可选私有 Nexus。不要写空 URL 的 maven {}。
// GitHub Packages 只覆盖 flyway-* 等例外；buck-bom / starter 走 mavenCentral()。
pluginManagement {
    repositories {
        def nexusMavenUrl = System.getenv('NEXUS_MAVEN_URL')
        if (nexusMavenUrl) {
            maven { url = uri(nexusMavenUrl) }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        def nexusMavenUrl = System.getenv('NEXUS_MAVEN_URL')
        if (nexusMavenUrl) {
            maven {
                url = uri(nexusMavenUrl)
                allowInsecureProtocol = nexusMavenUrl.startsWith('http://')
                credentials {
                    username = System.getenv('NEXUS_USERNAME') ?: ''
                    password = System.getenv('NEXUS_PASSWORD') ?: ''
                }
            }
        }
        mavenCentral()
    }
}

rootProject.name = 'brick-upper-backend'
