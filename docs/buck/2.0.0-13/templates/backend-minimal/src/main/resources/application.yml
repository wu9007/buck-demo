server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: brick-upper-application
  datasource:
    # 默认 PostgreSQL。H2 会被 BrickDatabaseDialectResolver 拒绝，不能用于 bootRun/test。
    url: ${BUSINESS_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${BUSINESS_DB_USERNAME:postgres}
    password: ${BUSINESS_DB_PASSWORD:}
    driver-class-name: ${BUSINESS_DB_DRIVER:org.postgresql.Driver}

brick:
  security:
    token:
      # 生产环境必须通过环境变量覆盖。
      base64-secret: ${BRICK_TOKEN_SECRET:YnJpY2stdXBwZXItZGV2LXNlY3JldC1tdXN0LWJlLWNoYW5nZWQtMzI=}
  transport:
    request-digest:
      enabled: false
    encryption:
      enabled: false
  orm:
    change-log:
      mybatis-interceptors: true
  iam:
    bootstrap:
      enabled: true
      catalog-enabled: true
      admin:
        enabled: true
        # 生产环境必须通过环境变量覆盖；已有运维账号不会被启动初始化重置密码。
        initial-password: ${BRICK_IAM_ADMIN_INITIAL_PASSWORD:ChangeMe123!}
        grant-registered-permissions: true
  mcp:
    enabled: false
    allow-anonymous: false

logging:
  level:
    io.github.wu9007: INFO
